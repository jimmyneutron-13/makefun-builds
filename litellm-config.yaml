# LiteLLM proxy config for the GitHub split lane (seek100).
# Mirrors ~/workspace/100milionseek/litellm-config.yaml on the VM (proven
# 23 Nov 2026): Codex speaks Responses API to the proxy; LiteLLM translates
# to Chat Completions at 100milionseek.top (no /v1/responses upstream).
# Upstream key comes from env OPENAI_API_KEY (SEEK100_API_KEY_<slot> secret,
# selected per account by the workflow step). The proxy itself requires a
# Bearer key = LITELLM_MASTER_KEY (random per run, generated by the workflow
# step; Codex sends the same value as LITELLM_API_KEY). No real key in this file.
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

model_list:
  - model_name: deepseek-v4.1-flash-free
    litellm_params:
      model: openai/deepseek-v4.1-flash-free
      api_base: https://100milionseek.top/v1
      api_key: os.environ/OPENAI_API_KEY
      use_chat_completions_api: true
